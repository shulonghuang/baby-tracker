<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8AAA94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="安安喂养">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icon-192.png">
<title id="pageTitle">安安喂养</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F9F8F6;--card:#FFFFFF;--text:#2D2B28;--text2:#8C8884;--text3:#B5B0AA;
  --green:#6B9B7E;--green-l:#E8F2EB;--amber:#C4A05A;--amber-l:#FCF6EC;
  --rose:#C4877A;--rose-l:#F9EDEA;--blue:#7A9EAA;--blue-l:#EDF3F5;
  --border:#EBE7E1;--radius:12px;--radius-sm:8px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto;position:relative;-webkit-tap-highlight-color:transparent}
.app-screen{padding-bottom:24px}
.app-header{padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.app-title{font-size:17px;font-weight:700;display:flex;align-items:center;gap:4px;letter-spacing:-0.3px}
.app-title .age-tag{font-size:10px;font-weight:500;background:var(--green-l);color:var(--green);padding:1px 7px;border-radius:8px;margin-left:2px}
.app-right{display:flex;align-items:center;gap:6px}
.icon-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:transparent;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:active{background:var(--border)}
.app-badge{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:var(--font)}
.app-badge.creator{background:var(--blue-l);color:var(--blue)}
.app-badge.offline{background:var(--amber-l);color:var(--amber)}
.app-badge.online{background:var(--green-l);color:var(--green)}

/* Weather Banner */
.weather-banner{margin:0 16px 10px;background:var(--card);border-radius:var(--radius);padding:9px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text2);flex-wrap:wrap;line-height:1.5}
.wx-date{font-weight:600;color:var(--text);white-space:nowrap}
.wx-icon{font-size:16px;line-height:1}
.wx-temp{font-weight:600;color:var(--text);white-space:nowrap}
.wx-uv{padding:1px 7px;border-radius:8px;font-size:11px;font-weight:600;white-space:nowrap}
.uv-low{background:#E8F5E9;color:#2E7D32}
.uv-moderate{background:#FFF8E1;color:#F9A825}
.uv-high{background:#FFF3E0;color:#E65100}
.uv-very-high{background:#FCE4EC;color:#C62828}
.uv-extreme{background:#EDE7F6;color:#4A148C}
.wx-advice{color:var(--text2);white-space:nowrap}
.wx-hint{color:var(--green);cursor:pointer}

/* Growth Banner */
.growth-banner{margin:0 16px 10px;background:var(--card);border-radius:var(--radius);padding:10px 14px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:13px}
.g-item{display:flex;align-items:center;gap:5px;white-space:nowrap}
.g-label{color:var(--text2);font-size:11px}
.g-val{font-weight:700;color:var(--text)}
.g-unit{font-size:10px;color:var(--text3)}
.g-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.g-dot.ok{background:var(--green)}.g-dot.warn{background:var(--amber)}.g-dot.bad{background:var(--rose)}
.g-date{font-size:10px;color:var(--text3);width:100%;margin-top:2px}
.growth-empty{font-size:12px;color:var(--text2);text-align:center;padding:4px 0;width:100%}

/* Room Panel */
.room-panel{display:none;background:var(--card);margin:0 16px 12px;border-radius:var(--radius);padding:16px;box-shadow:0 1px 6px rgba(0,0,0,0.03)}
.room-panel.show{display:block}
.room-code-display{text-align:center;margin-bottom:12px}
.room-code-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.room-code-val{font-size:28px;font-weight:700;letter-spacing:6px;color:var(--green)}
.room-members{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
.member-chip{padding:6px 14px;border-radius:20px;font-size:12px;background:var(--bg)}
.member-chip.me{background:var(--green-l);font-weight:600}
.room-hint-text{font-size:11px;color:var(--text2);text-align:center}
.room-btns{display:flex;gap:8px;margin-top:8px}
.room-btn-sm{padding:6px 14px;border-radius:20px;font-size:12px;border:1.5px solid var(--border);cursor:pointer;background:transparent;transition:.2s;font-family:var(--font)}
.room-btn-sm:hover{border-color:var(--rose);color:var(--rose)}
.room-btn-sm.primary{background:var(--green-l);border-color:var(--green);color:var(--green)}
.sync-server-input{display:flex;gap:6px;margin-top:8px}
.sync-input{flex:1;padding:8px 12px;border:1.5px solid var(--border);border-radius:20px;font-size:12px;outline:none;background:var(--bg);font-family:var(--font)}

/* Settings Panel */
.settings-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.3);z-index:100;align-items:center;justify-content:center;overflow-y:auto}
.settings-overlay.show{display:flex}
.settings-panel{background:var(--card);border-radius:var(--radius);padding:24px;width:calc(100% - 40px);max-width:400px;box-shadow:0 8px 30px rgba(0,0,0,0.12);max-height:90vh;overflow-y:auto}
.settings-title{font-size:17px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between}
.settings-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text2)}
.settings-field{margin-bottom:16px}
.settings-label{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:6px}
.settings-input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;font-family:var(--font);background:var(--bg)}
.settings-input:focus{border-color:var(--green)}
.settings-select{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:14px;outline:none;font-family:var(--font);background:var(--bg);color:var(--text);appearance:auto}
.settings-select:focus{border-color:var(--green)}
.settings-btn{width:100%;padding:12px;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;border:none;background:var(--green);color:#fff;font-family:var(--font);margin-top:8px}
.settings-btn:active{opacity:0.85}
.settings-hint{font-size:11px;color:var(--text2);text-align:center;margin-top:8px}

/* Summary */
.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 10px}
.summary-card{background:var(--card);border-radius:var(--radius-sm);padding:10px 8px;text-align:center}
.summary-val{font-size:18px;font-weight:700;margin-bottom:1px}
.summary-val.done{color:var(--green)}.summary-val.near{color:var(--amber)}.summary-val.low{color:var(--rose)}
.summary-label{font-size:10px;color:var(--text2)}

/* Tabs */
.tab-bar{display:flex;padding:0 16px 10px;gap:6px}
.tab-btn{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;border-radius:var(--radius-sm);cursor:pointer;transition:.2s;border:none;background:transparent;color:var(--text2);position:relative;font-family:var(--font)}
.tab-btn.active{background:var(--card);color:var(--text)}
.tab-dot{position:absolute;top:2px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--rose)}
.tab-content{display:none;padding:0 16px}
.tab-content.active{display:block}

/* Section */
.section{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:10px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer;user-select:none}
.section-title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.section-chip{font-size:10px;padding:2px 7px;border-radius:8px;font-weight:600}
.section-chip.done{background:var(--green-l);color:var(--green)}.section-chip.partial{background:var(--amber-l);color:var(--amber)}.section-chip.none{background:var(--rose-l);color:var(--rose)}
.section-toggle{font-size:12px;color:var(--text2);transition:.2s}
.section.open .section-toggle{transform:rotate(180deg)}
.section-body{display:none}
.section.open .section-body{display:block}

/* Meal tabs */
.meal-tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.meal-tab{flex-shrink:0;padding:6px 12px;border-radius:16px;font-size:12px;border:1.5px solid var(--border);cursor:pointer;transition:.2s;white-space:nowrap;background:transparent;font-family:var(--font);color:var(--text2)}
.meal-tab.active{background:var(--green-l);border-color:var(--green);color:var(--green);font-weight:600}

/* Time input */
.time-row{display:flex;align-items:center;gap:6px;margin-bottom:10px;padding:6px 10px;background:var(--bg);border-radius:var(--radius-sm)}
.time-label{font-size:11px;color:var(--text2);white-space:nowrap}
.time-input{padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font);width:80px;text-align:center;background:#fff}
.time-suggestion{font-size:10px;color:var(--green);cursor:pointer;margin-left:3px}
.time-suggestion:hover{text-decoration:underline}

/* Food */
.food-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bg)}
.food-item:last-child{border-bottom:none}
.food-left{display:flex;align-items:center;gap:8px;flex:1;cursor:pointer;min-width:0}
.food-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
.food-check.checked{background:var(--green);border-color:var(--green)}
.food-check.checked::after{content:'\2713';color:#fff;font-size:10px;font-weight:700}
.food-name{font-size:13px}
.food-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.food-qty{display:flex;align-items:center;gap:4px;min-width:50px;justify-content:flex-end}
.food-qty-btn{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--border);background:transparent;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;color:var(--text)}
.food-qty-btn:active{background:var(--border)}
.food-qty-val{font-size:13px;font-weight:600;min-width:24px;text-align:center}
.food-ref{font-size:10px;color:var(--text2);min-width:60px;text-align:right}
.qty-unit{font-size:10px;color:var(--text2);margin-left:1px}

/* Bottom summary */
.bottom-summary{padding:8px 0;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;border-top:1px solid var(--bg);margin-top:4px}
.bottom-summary .ref{color:var(--blue)}

/* Confirm button */
.confirm-row{display:flex;align-items:center;justify-content:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--bg)}
.confirm-btn{padding:10px 36px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;border:none;background:var(--green);color:#fff;font-family:var(--font);transition:.2s}
.confirm-btn:active{transform:scale(0.97);opacity:0.9}
.confirm-btn:disabled{background:var(--border);color:var(--text2);cursor:not-allowed;transform:none;opacity:1}
.confirm-hint{font-size:10px;color:var(--text2);text-align:center;margin-top:5px}
.confirm-done{font-size:12px;color:var(--green);font-weight:600}
.confirm-edit-btn{padding:4px 12px;border-radius:12px;font-size:11px;border:1.5px solid var(--green);cursor:pointer;background:transparent;color:var(--green);transition:.2s;font-family:var(--font);margin-left:10px}
.confirm-edit-btn:active{background:var(--green-l)}

/* Activity */
.activity-row,.sleep-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bg)}
.activity-row:last-child,.sleep-row:last-child{border-bottom:none}
.act-check{width:18px;height:18px;border-radius:5px;border:2px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.2s}
.act-check.checked{background:var(--green);border-color:var(--green)}
.act-check.checked::after{content:'\2713';color:#fff;font-size:10px;font-weight:700}
.act-label{font-size:13px;display:flex;align-items:center;gap:5px}

/* Games */
.game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.game-card{padding:10px 4px;border-radius:var(--radius-sm);border:1.5px solid var(--border);text-align:center;cursor:pointer;transition:.2s;font-size:11px;line-height:1.3}
.game-card:hover,.game-card.selected{border-color:var(--green);background:var(--green-l)}
.game-card.selected{font-weight:600;color:var(--green)}
.game-emoji{font-size:18px;display:block;margin-bottom:2px}

/* Water */
.water-slots{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.water-slot{padding:6px 10px;border-radius:16px;font-size:11px;border:1.5px solid var(--border);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:3px}
.water-slot.recorded{background:var(--green-l);border-color:var(--green)}
.water-slot .slot-amount{font-weight:600;margin-left:2px}

/* Measurement Section */
.measure-input-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bg)}
.measure-input-row:last-child{border-bottom:none}
.measure-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.measure-field{display:flex;align-items:center;gap:3px}
.measure-field input{width:58px;padding:7px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;text-align:center;font-family:var(--font);background:var(--bg)}
.measure-field input:focus{border-color:var(--green);outline:none}
.measure-field .m-unit{font-size:11px;color:var(--text2);min-width:20px}
.measure-date-input{width:125px;padding:5px 8px;border:1.5px solid var(--border);border-radius:6px;font-size:11px;font-family:var(--font);background:var(--bg);margin-left:6px}
.measure-history{font-size:10px;color:var(--text2);margin-top:6px;padding:6px 8px;background:var(--bg);border-radius:var(--radius-sm)}
.measure-history-row{display:flex;justify-content:space-between;padding:2px 0}

/* Growth Analysis in Analysis Tab */
.growth-advice{padding:12px;border-radius:var(--radius-sm);margin-top:8px;font-size:12px;line-height:1.6}
.growth-advice.ok{background:var(--green-l);color:var(--text)}
.growth-advice.warn{background:var(--amber-l);color:var(--text)}
.growth-advice.bad{background:var(--rose-l);color:var(--text)}

/* Analysis - Comprehensive */
.analysis-dim{margin-bottom:16px}
.analysis-dim-title{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg);border-radius:var(--radius-sm)}
.analysis-item{padding:12px 0;border-bottom:1px solid var(--bg)}
.analysis-item:last-child{border-bottom:none}
.analysis-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.analysis-name{font-size:13px;font-weight:600}
.analysis-status{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px}
.analysis-status.ok{background:var(--green-l);color:var(--green)}.analysis-status.warn{background:var(--amber-l);color:var(--amber)}.analysis-status.bad{background:var(--rose-l);color:var(--rose)}
.analysis-bar{height:6px;border-radius:3px;background:var(--bg);overflow:hidden;position:relative}
.analysis-bar .marker{position:absolute;top:0;width:2px;height:100%;background:var(--amber);z-index:1}
.analysis-fill{height:100%;border-radius:3px;transition:.3s}
.analysis-fill.ok{background:var(--green)}.analysis-fill.warn{background:var(--amber)}.analysis-fill.bad{background:var(--rose)}
.analysis-detail{font-size:11px;color:var(--text2);margin-top:4px}

/* Alerts */
.alert-item{padding:14px;border-radius:var(--radius-sm);margin-bottom:8px;font-size:13px;line-height:1.5}
.alert-item.danger{background:var(--rose-l);border-left:3px solid var(--rose)}
.alert-item.warning{background:var(--amber-l);border-left:3px solid var(--amber)}
.alert-item.info{background:var(--blue-l);border-left:3px solid var(--blue)}
.alert-title{font-weight:600;margin-bottom:2px}
.alert-desc{color:var(--text2);font-size:12px}
.no-alerts{text-align:center;padding:40px;color:var(--text2)}

/* Science */
.science-card{background:var(--blue-l);border-radius:var(--radius-sm);padding:14px;margin-top:10px}
.science-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:6px}
.science-text{font-size:12px;color:var(--text2);line-height:1.6}

/* Sync */
.sync-text{font-size:11px;color:var(--text2);display:flex;align-items:center;gap:4px}
.sync-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.sync-dot.local{background:var(--amber)}.sync-dot.online{background:var(--green)}

/* Toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>

<div class="app-screen" id="appScreen">

  <!-- Header -->
  <div class="app-header">
    <div class="app-title" id="headerTitle"><span id="babyNameDisplay">安安</span>喂养<span class="age-tag" id="ageTag" style="display:none"></span></div>
    <div class="app-right">
      <span class="sync-text" id="syncStatus"><span class="sync-dot local"></span> 本机</span>
      <button class="icon-btn" id="settingsBtn" onclick="openSettings()" title="设置">&#x2699;</button>
      <button class="app-badge offline" id="roomBtn" onclick="toggleRoom()">同步</button>
    </div>
  </div>

  <!-- Settings Overlay -->
  <div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
      <div class="settings-title">设置 <button class="settings-close" onclick="closeSettings()">✕</button></div>
      <div class="settings-field">
        <div class="settings-label">宝宝名字</div>
        <input class="settings-input" type="text" id="setBabyName" placeholder="输入宝宝的名字">
      </div>
      <div class="settings-field">
        <div class="settings-label">出生日期</div>
        <input class="settings-input" type="date" id="setBirthday">
      </div>
      <div class="settings-field">
        <div class="settings-label">性别（用于生长发育评估）</div>
        <select class="settings-select" id="setGender">
          <option value="boy">👦 男宝宝</option>
          <option value="girl">👧 女宝宝</option>
        </select>
      </div>
      <div class="settings-field">
        <div class="settings-label">所在城市（用于天气）</div>
        <input class="settings-input" type="text" id="setCity" placeholder="例如: 北京">
      </div>
      <div class="settings-hint" id="ageCalc"></div>
      <button class="settings-btn" id="saveSettingsBtn" onclick="saveSettings()">保存设置</button>
    </div>
  </div>

  <!-- Room Panel -->
  <div class="room-panel" id="roomPanel">
    <div id="roomContent"></div>
  </div>

  <!-- Weather Banner -->
  <div class="weather-banner" id="weatherBanner">
    <span class="wx-date" id="weatherDate"></span>
    <span class="wx-icon" id="weatherIcon">--</span>
    <span class="wx-temp" id="weatherTemp">加载中...</span>
    <span id="weatherDetail"></span>
  </div>

  <!-- Growth Banner -->
  <div class="growth-banner" id="growthBanner"></div>

  <!-- Summary -->
  <div class="summary-row">
    <div class="summary-card"><div class="summary-val done" id="sumFeeding">0%</div><div class="summary-label">喂养</div></div>
    <div class="summary-card"><div class="summary-val low" id="sumActivity">0%</div><div class="summary-label">户外</div></div>
    <div class="summary-card"><div class="summary-val low" id="sumSleep">0%</div><div class="summary-label">睡眠</div></div>
    <div class="summary-card"><div class="summary-val low" id="sumWater">0%</div><div class="summary-label">饮水</div></div>
  </div>

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('record')">打卡</button>
    <button class="tab-btn" onclick="switchTab('analysis')">分析</button>
    <button class="tab-btn" id="alertTabBtn" onclick="switchTab('alerts')">提醒<span class="tab-dot" id="alertDot" style="display:none"></span></button>
  </div>

  <!-- Record Tab -->
  <div class="tab-content active" id="tabRecord">
    <div class="section open" id="secFeeding">
      <div class="section-header" onclick="toggleSection('secFeeding')">
        <div class="section-title">喂养打卡 <span class="section-chip none" id="chipFeeding">未记录</span></div>
        <span class="section-toggle">▼</span>
      </div>
      <div class="section-body">
        <div class="meal-tabs" id="mealTabs"></div>
        <div id="mealContent"></div>

function getGrowthRef(gender, type, ageMonths) {
  const key = type + '_' + gender;
  const data = GROWTH_STANDARDS[key];
  if (!data) return null;
  const months = Object.keys(data).map(Number).sort((a,b)=>a-b);
  let lo = months[0], hi = months[months.length-1];
  for (const m of months) {
    if (m <= ageMonths) lo = m;
    if (m >= ageMonths && hi === months[months.length-1]) { hi = m; break; }
  }
  if (lo === hi) return { ...data[lo], month: lo };
  // Interpolate
  const dLo = data[lo], dHi = data[hi];
  const ratio = (ageMonths - lo) / (hi - lo);
  return {
    p3: Math.round((dLo.p3 + (dHi.p3 - dLo.p3) * ratio) * 10) / 10,
    p50: Math.round((dLo.p50 + (dHi.p50 - dLo.p50) * ratio) * 10) / 10,
    p97: Math.round((dLo.p97 + (dHi.p97 - dLo.p97) * ratio) * 10) / 10,
    month: ageMonths
  };
}

function getFootRef(ageMonths) {
  const months = Object.keys(FOOT_REFERENCES).map(Number).sort((a,b)=>a-b);
  let lo = months[0], hi = months[months.length-1];
  for (const m of months) {
    if (m <= ageMonths) lo = m;
    if (m >= ageMonths && hi === months[months.length-1]) { hi = m; break; }
  }
  if (lo === hi) return FOOT_REFERENCES[lo].p50;
  const ratio = (ageMonths - lo) / (hi - lo);
  return Math.round((FOOT_REFERENCES[lo].p50 + (FOOT_REFERENCES[hi].p50 - FOOT_REFERENCES[lo].p50) * ratio) * 10) / 10;
}

function evaluateGrowth(actual, standard) {
  if (!standard || !actual) return null;
  const pct = actual / standard.p50;
  if (actual < standard.p3) return { level: 'bad', label: '偏低 ⚠', pct, desc: '低于同龄第3百分位，建议咨询医生' };
  if (actual < standard.p50 * 0.95) return { level: 'warn', label: '略低', pct, desc: '低于同龄平均水平，注意营养和睡眠' };
  if (actual > standard.p97) return { level: 'warn', label: '偏高', pct, desc: '高于同龄第97百分位，注意均衡饮食' };
  if (actual > standard.p50 * 0.95 && actual <= standard.p50 * 1.05) return { level: 'ok', label: '标准 ✓', pct, desc: '处于同龄平均水平，发育良好' };
  return { level: 'ok', label: '正常 ✓', pct, desc: '在同龄正常范围内' };
}

function getAgeRef() {
  const profile = getBabyProfile();
  if (!profile.birthday) return AGE_REFERENCES['12-18'];
  const ageMonths = calcAgeMonths(profile.birthday);
  if (ageMonths < 18) return AGE_REFERENCES['12-18'];
  if (ageMonths < 24) return AGE_REFERENCES['18-24'];
  return AGE_REFERENCES['24-36'];
}

function calcAgeMonths(birthday) {
  const b = new Date(birthday);
  const now = new Date();
  let months = (now.getFullYear() - b.getFullYear()) * 12 + (now.getMonth() - b.getMonth());
  if (now.getDate() < b.getDate()) months--;
  return Math.max(0, months);
}

function getAgeStr() {
  const profile = getBabyProfile();
  if (!profile.birthday) return '';
  const m = calcAgeMonths(profile.birthday);
  if (m < 24) return m + '个月';
  return Math.floor(m/12)+'岁'+(m%12)+'个月';
}

function defaultFeeding() {
  const d = {};
  const patterns = getFeedingPatterns();
  for (const m of MEALS) {
    const p = patterns ? patterns[m.id] : null;
    d[m.id] = { completed: false, time: p ? p.avgTime : m.defaultTime, items: {} };
    const foods = MEAL_FOODS[m.id] || [];
    for (const f of foods) {
      const topFood = p?.topFoods?.find(tf => tf.id === f.id);
      d[m.id].items[f.id] = { checked: false, qty: topFood ? topFood.avgQty : 0 };
    }
  }
  return d;
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const all = JSON.parse(raw);
      if (all[TODAY]) {
        const data = all[TODAY];
        for (const m of MEALS) {
          if (data.feeding && data.feeding[m.id] && !data.feeding[m.id].time) {
            data.feeding[m.id].time = m.defaultTime;
          }
        }
        if (data.activity && data.activity.confirmed === undefined) data.activity.confirmed = false;
        if (data.sleep && data.sleep.confirmed === undefined) data.sleep.confirmed = false;
        if (data.water && data.water.confirmed === undefined) data.water.confirmed = false;
        if (data.supplements && data.supplements.confirmed === undefined) data.supplements.confirmed = false;
        if (data.activity && Array.isArray(data.activity.games)) {
          const obj = {};
          data.activity.games.forEach(id => { obj[id] = 15; });
          data.activity.games = obj;
        }
        return data;
      }
    }
  } catch(e) {}
  return defaultData();
}

function saveData(data) {
  let all = {};
  try { all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}
  all[TODAY] = data;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  updateFeedingPatterns(data);
  renderAll();
  scheduleSync();
}

// ========== SERVER SYNC ==========
let syncTimer = null;
let isLoadingFromServer = false;

function scheduleSync() {
  if (isLoadingFromServer) return;
  if (syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => syncToServer(), 800);
}

function syncToServer() {
  const cfg = getSyncConfig();
  if (cfg.mode !== 'server' || !cfg.url) return;
  const sections = [
    { name: 'feeding', data: { meals: state.feeding } },
    { name: 'activity', data: { confirmed: state.activity.confirmed === true, outdoor_am: state.activity.outdoor_am ? state.activity.outdoor_am_min : 0, outdoor_pm: state.activity.outdoor_pm ? state.activity.outdoor_pm_min : 0, walking: state.activity.walking ? state.activity.walking_min : 0, games: state.activity.games || {} } },
    { name: 'sleep', data: { confirmed: state.sleep.confirmed === true, night: state.sleep.night || 0, nap_am: state.sleep.nap_am || 0, nap_pm: state.sleep.nap_pm || 0 } },
    { name: 'water', data: { confirmed: state.water.confirmed === true, records: state.water.records || [] } },
    { name: 'supplements', data: { confirmed: state.supplements.confirmed === true, ad: state.supplements.ad || false, dha: state.supplements.dha || false } }
  ];
  for (const sec of sections) {
    fetch(cfg.url + '/api/records', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-auth-token': cfg.token, 'x-user-id': cfg.userId, 'x-room-id': cfg.roomId },

async function loadFromServer() {
  const cfg = getSyncConfig();
  if (cfg.mode !== 'server' || !cfg.url) return;
  try {
    const res = await fetch(cfg.url + '/api/records/' + TODAY, {
      headers: { 'x-auth-token': cfg.token, 'x-user-id': cfg.userId, 'x-room-id': cfg.roomId }
    });
    const result = await res.json();
    if (!result.merged) return;
    isLoadingFromServer = true;
    const merged = result.merged;
    const newState = defaultData();
    if (merged.feeding?.meals) {
      for (const [mealId, mealData] of Object.entries(merged.feeding.meals)) {
        if (!newState.feeding[mealId]) continue;
        newState.feeding[mealId].time = mealData.time || newState.feeding[mealId].time;
        newState.feeding[mealId].completed = mealData.completed || false;
        for (const [foodId, foodData] of Object.entries(mealData.items || {})) {
          if (!newState.feeding[mealId].items[foodId]) continue;
          newState.feeding[mealId].items[foodId].checked = foodData.checked || false;
          newState.feeding[mealId].items[foodId].qty = foodData.qty || 0;
        }
      }
    }
    if (merged.activity) {
      const a = merged.activity;
      newState.activity.confirmed = a.confirmed === true;
      if (a.outdoor_am > 0) { newState.activity.outdoor_am = true; newState.activity.outdoor_am_min = a.outdoor_am; }
      if (a.outdoor_pm > 0) { newState.activity.outdoor_pm = true; newState.activity.outdoor_pm_min = a.outdoor_pm; }
      if (a.walking > 0) { newState.activity.walking = true; newState.activity.walking_min = a.walking; }
      if (a.games) newState.activity.games = a.games;
    }
    if (merged.sleep) {
      newState.sleep.confirmed = merged.sleep.confirmed === true;
      newState.sleep.night = merged.sleep.night || 0;
      newState.sleep.nap_am = merged.sleep.nap_am || 0;
      newState.sleep.nap_pm = merged.sleep.nap_pm || 0;
    }
    if (merged.water?.records) {
      newState.water.confirmed = merged.water.confirmed === true;
      newState.water.records = merged.water.records;
    }
    if (merged.supplements) {
      newState.supplements.confirmed = merged.supplements.confirmed === true;
      newState.supplements.ad = merged.supplements.ad || false;
      newState.supplements.dha = merged.supplements.dha || false;
    }
    state = newState;
    let all = {};
    try { all = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}
    all[TODAY] = newState;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
    renderAll();
    isLoadingFromServer = false;
  } catch(e) { isLoadingFromServer = false; }
}

function getFeedingPatterns() {
  try { const raw = localStorage.getItem(PATTERN_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e) { return null; }
}

function updateFeedingPatterns(data) {
  const patterns = getFeedingPatterns() || {};
  for (const m of MEALS) {
    const meal = (data.feeding || {})[m.id];
    if (!meal || !meal.time) continue;
    const hasFood = Object.values(meal.items || {}).some(i => i.checked);
    if (!hasFood) continue;
    if (!patterns[m.id]) patterns[m.id] = { times: [], foods: {} };
    if (!patterns[m.id].times.includes(meal.time)) {
      patterns[m.id].times.push(meal.time);
      if (patterns[m.id].times.length > 14) patterns[m.id].times.shift();
    }
    for (const [fid, fdata] of Object.entries(meal.items || {})) {
      if (!fdata.checked) continue;
      if (!patterns[m.id].foods[fid]) patterns[m.id].foods[fid] = [];
      patterns[m.id].foods[fid].push(fdata.qty);
      if (patterns[m.id].foods[fid].length > 14) patterns[m.id].foods[fid].shift();
    }
  }
  const suggestions = {};
  for (const [mid, p] of Object.entries(patterns)) {
    if (!p.times.length) continue;
    const avgMinutes = Math.round(p.times.reduce((sum, t) => { const [h, m] = t.split(':').map(Number); return sum + h*60 + m; }, 0) / p.times.length);
    const avgH = String(Math.floor(avgMinutes/60)).padStart(2,'0');
    const avgM = String(avgMinutes%60).padStart(2,'0');
    const topFoods = Object.entries(p.foods).map(([id, qs]) => ({ id, avgQty: Math.round(qs.reduce((a,b)=>a+b,0)/qs.length), count: qs.length })).sort((a,b)=>b.count-a.count);
    suggestions[mid] = { avgTime: avgH+':'+avgM, count: p.times.length, topFoods };
  }
  localStorage.setItem(PATTERN_KEY, JSON.stringify(suggestions));
}

let weatherData = null;

function getUVLevel(uv) {
  if (uv <= 2) return { cls:'uv-low', label:'低', advice:'无需特殊防护' };
  if (uv <= 5) return { cls:'uv-moderate', label:'中等', advice:'涂抹SPF15+防晒霜，戴帽子' };
  if (uv <= 7) return { cls:'uv-high', label:'强', advice:'涂抹SPF30+防晒霜，避免10-16点直晒' };
  if (uv <= 10) return { cls:'uv-very-high', label:'很强', advice:'SPF50+防晒霜，帽子+长袖，尽量不外出' };
  return { cls:'uv-extreme', label:'极强', advice:'避免外出，全副武装防护' };
}

async function fetchWeather(city, lat, lon) {
  try {
    let url;
    if (lat !== undefined && lon !== undefined) {
      url = 'https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current_weather=true&daily=temperature_2m_max,temperature_2m_min,uv_index_max,weather_code&timezone=Asia/Shanghai&forecast_days=1';
    } else if (city) {
      // Geocode city
      const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1&language=zh');
      const geoData = await geoRes.json();
      if (!geoData.results?.length) return;
      const r = geoData.results[0];
      url = 'https://api.open-meteo.com/v1/forecast?latitude='+r.latitude+'&longitude='+r.longitude+'&current_weather=true&daily=temperature_2m_max,temperature_2m_min,uv_index_max,weather_code&timezone=Asia/Shanghai&forecast_days=1';
    } else return;

    const res = await fetch(url);
    const data = await res.json();
    const cur = data.current_weather;
    const daily = data.daily;
    const wc = WEATHER_CODES[cur.weathercode] || { icon:'🌡️', desc:'--' };
    weatherData = {
      temp: Math.round(cur.temperature),
      tempMax: daily ? Math.round(daily.temperature_2m_max[0]) : null,
      tempMin: daily ? Math.round(daily.temperature_2m_min[0]) : null,
      icon: wc.icon,
      desc: wc.desc,
      uv: daily ? daily.uv_index_max[0] : null,
      city: city || '',
      ts: Date.now()
    };
    // Cache for 3 hours
    weatherData._cache = true;
    localStorage.setItem(WEATHER_CACHE_KEY, JSON.stringify(weatherData));
  } catch(e) {
    console.log('Weather fetch failed:', e);
  }
}

function loadWeatherCache() {
  try {
    const raw = localStorage.getItem(WEATHER_CACHE_KEY);
    if (raw) {
      const cached = JSON.parse(raw);
      // Cache valid for 3 hours
      if (Date.now() - cached.ts < 3 * 3600000) {
        weatherData = cached;
        return true;
      }
    }
  } catch(e) {}
  return false;
}

async function refreshWeather() {
  const profile = getBabyProfile();
  const city = profile.city;
  if (!city) return;

  // Try cache first

  await fetchWeather(city);

function renderWeather() {
  const now = new Date();
  const weekdays = ['日','一','二','三','四','五','六'];
  const dateStr = (now.getMonth()+1)+'/'+now.getDate()+' 周'+weekdays[now.getDay()];
  document.getElementById('weatherDate').textContent = dateStr;

  if (weatherData) {
    document.getElementById('weatherIcon').textContent = weatherData.icon;
    let tempStr = weatherData.temp + '°';
    if (weatherData.tempMax) tempStr += ' ' + weatherData.tempMax + '/' + weatherData.tempMin;
    document.getElementById('weatherTemp').textContent = tempStr;

    let detail = '';
    if (weatherData.city) detail += weatherData.city;
    if (weatherData.desc) detail += ' ' + weatherData.desc;

    if (weatherData.uv !== null && weatherData.uv !== undefined) {
      const uvInfo = getUVLevel(weatherData.uv);
      detail += ' UV ' + weatherData.uv + ' <span class="wx-uv ' + uvInfo.cls + '">' + uvInfo.label + '</span>';
      detail += ' <span class="wx-advice">' + uvInfo.advice + '</span>';
    }
    document.getElementById('weatherDetail').innerHTML = detail;
  } else {
    document.getElementById('weatherIcon').textContent = '—';
    document.getElementById('weatherTemp').textContent = '';
    const profile = getBabyProfile();
    document.getElementById('weatherDetail').innerHTML = profile.city ? '天气加载中...' : '<span class="wx-hint" onclick="openSettings()">设置城市</span>';
  }
}

function saveMeasurements() {
  if (!isCreator()) {
    toast('仅主账号可更新生长发育数据');
    return;
  }
  const profile = getBabyProfile();
  const nowStr = new Date().toISOString().slice(0, 10);

  const heightVal = parseFloat(document.getElementById('measHeight').value);
  const weightVal = parseFloat(document.getElementById('measWeight').value);
  const footVal = parseFloat(document.getElementById('measFoot').value);

  const m = profile.measurements;

  if (!isNaN(heightVal) && heightVal > 0) {
    m.height = { value: heightVal, date: document.getElementById('measHeightDate').value || nowStr };
  } else {
    m.height = null;
  }
  if (!isNaN(weightVal) && weightVal > 0) {
    m.weight = { value: weightVal, date: document.getElementById('measWeightDate').value || nowStr };
  } else {
    m.weight = null;
  }
  if (!isNaN(footVal) && footVal > 0) {
    m.foot = { value: footVal, date: document.getElementById('measFootDate').value || nowStr };
  } else {
    m.foot = null;
  }

  profile.measurements = m;

  // Add to history
  const historyEntry = { date: nowStr };
  if (m.height) historyEntry.height = m.height.value;
  if (m.weight) historyEntry.weight = m.weight.value;
  if (m.foot) historyEntry.foot = m.foot.value;

  if (!profile.measurementHistory) profile.measurementHistory = [];
  // Check if today already has an entry
  const existingIdx = profile.measurementHistory.findIndex(h => h.date === nowStr);
  if (existingIdx >= 0) {
    profile.measurementHistory[existingIdx] = { ...profile.measurementHistory[existingIdx], ...historyEntry };
  } else {
    profile.measurementHistory.push(historyEntry);
  }

  saveBabyProfile(profile);
  renderGrowthBanner();
  renderMeasurements();
  renderAnalysis();
  renderAlerts();
  toast('生长发育数据已保存');
}

  if (patterns && patterns[currentMeal] && patterns[currentMeal].count >= 2) {
    const p = patterns[currentMeal];
    suggestionHtml = '<span class="time-suggestion" onclick="applyPatternTime(\''+currentMeal+'\',\''+p.avgTime+'\')" title="基于最近 '+p.count+' 次记录的推荐时间">建议 '+p.avgTime+'</span>';
  }
  const hasAnyChecked = foods.some(f => meal.items[f.id]?.checked);
  let html = '<div class="time-row"><span class="time-label">⏰ 时间</span><input class="time-input" type="time" value="'+time+'" onchange="updateMealTimePending(\''+currentMeal+'\',this.value)" id="time_'+currentMeal+'">'+suggestionHtml+'</div>';
  html += foods.map(f => {
    const item = meal.items[f.id] || { checked:false, qty:0 };
    return '<div class="food-item"><div class="food-left" onclick="toggleFoodPending(\''+currentMeal+'\',\''+f.id+'\')"><div class="food-check'+(item.checked?' checked':'')+'"></div><span class="food-name">'+f.name+'</span></div><div class="food-right">'+(item.checked ? '<div class="food-qty"><button class="food-qty-btn" onclick="event.stopPropagation();adjustQtyPending(\''+currentMeal+'\',\''+f.id+'\',-'+f.step+')">\u2212</button><span class="food-qty-val">'+item.qty+'</span><button class="food-qty-btn" onclick="event.stopPropagation();adjustQtyPending(\''+currentMeal+'\',\''+f.id+'\','+f.step+')">+</button><span class="qty-unit">'+f.unit+'</span></div>' : '')+'<span class="food-ref">建议 '+f.ref+f.unit+'</span></div></div>';
  }).join('');
  if (hasConfirmed) {
    html += '<div class="confirm-row"><span class="confirm-done">✅ 已打卡</span><button class="confirm-edit-btn" onclick="unconfirmMeal(\''+currentMeal+'\')">修改</button></div>';
  } else {
    html += '<div class="confirm-row"><button class="confirm-btn"'+(hasAnyChecked?'':' disabled')+' onclick="confirmMeal(\''+currentMeal+'\')">✅ 确认打卡</button></div>';
    if (!hasAnyChecked) html += '<div class="confirm-hint">请先勾选食物品种，再调整数量，然后确认打卡</div>';
  }
  document.getElementById('mealContent').innerHTML = html;
}

function applyPatternTime(mealId, time) {
  if (!state.feeding[mealId]) state.feeding[mealId] = { completed:false, items:{} };
  state.feeding[mealId].time = time;
  renderMealContent(); updateChipsOnly();
}
function updateMealTimePending(mealId, time) {
  if (!state.feeding[mealId]) state.feeding[mealId] = { completed:false, items:{} };
  state.feeding[mealId].time = time;
  renderMealContent();
}
function toggleFoodPending(mealId, foodId) {
  if (!state.feeding[mealId]) state.feeding[mealId] = { completed:false, time:MEALS.find(m=>m.id===mealId)?.defaultTime||'07:30', items:{} };
  const item = state.feeding[mealId].items[foodId] || { checked:false, qty:0 };
  item.checked = !item.checked;
  if (item.checked && item.qty === 0) { const f = (MEAL_FOODS[mealId]||[]).find(x => x.id===foodId); if (f) item.qty = f.ref; }
  if (!item.checked) item.qty = 0;
  state.feeding[mealId].items[foodId] = item;
  renderMealContent(); updateChipsOnly();
}
function adjustQtyPending(mealId, foodId, delta) {
  if (!state.feeding[mealId]?.items[foodId]) return;
  state.feeding[mealId].items[foodId].qty = Math.max(0, Math.round((state.feeding[mealId].items[foodId].qty + delta) * 100) / 100);
  renderMealContent();
}
function confirmMeal(mealId) {
  if (!state.feeding[mealId]) state.feeding[mealId] = { completed:false, items:{} };
  const foods = MEAL_FOODS[mealId] || [];
  state.feeding[mealId].completed = foods.some(f => state.feeding[mealId].items[f.id]?.checked);
  saveData(state);
}
function unconfirmMeal(mealId) {
  if (!state.feeding[mealId]) return;
  state.feeding[mealId].completed = false;
  saveData(state);
}
function updateChipsOnly() { updateSummary(); renderMealTabs(); renderChips(); }

}
function adjustWaterPending(slot,d) {

function removeWaterPending(slot) {

function confirmWater() { state.water.confirmed = true; saveData(state); }
function unconfirmWater() { state.water.confirmed = false; saveData(state); }

// ========== SUMMARY & CHIPS ==========
function updateSummary() {
  let meals=0;
  for (const m of MEALS) { const meal = state.feeding[m.id]; if (meal && Object.values(meal.items||{}).some(i=>i.checked)) meals++; }
  const fp = Math.min(100,Math.round(meals/6*100));
  document.getElementById('sumFeeding').textContent = fp+'%';
  document.getElementById('sumFeeding').className = 'summary-val '+(fp>=80?'done':fp>=50?'near':'low');

  const to = (state.activity.outdoor_am?state.activity.outdoor_am_min:0)+(state.activity.outdoor_pm?state.activity.outdoor_pm_min:0);
  const ap = Math.min(100,Math.round(to/getAgeRef().outdoor.min*100));
  document.getElementById('sumActivity').textContent = ap+'%';
  document.getElementById('sumActivity').className = 'summary-val '+(ap>=80?'done':ap>=40?'near':'low');

  const ts = state.sleep.night+state.sleep.nap_am+state.sleep.nap_pm;
  const sp = Math.min(100,Math.round(ts/getAgeRef().sleep.total*100));
  document.getElementById('sumSleep').textContent = sp+'%';
  document.getElementById('sumSleep').className = 'summary-val '+(sp>=80?'done':sp>=60?'near':'low');

  const tw = (state.water.records||[]).reduce((s,r)=>s+(r.amount||0),0);
  const wp = Math.min(100,Math.round(tw/getAgeRef().water.min*100));
  document.getElementById('sumWater').textContent = wp+'%';
  document.getElementById('sumWater').className = 'summary-val '+(wp>=80?'done':wp>=40?'near':'low');
}

function renderChips() {
  function chip(s,cond) {
    const el = document.getElementById('chip'+s);
    if (!el) return;
    let cls='none',txt='未记录';
    if (cond.done) { cls='done'; txt=cond.txt; }
    else if (cond.partial) { cls='partial'; txt=cond.txt2||'部分'; }
    el.className='section-chip '+cls; el.textContent=txt;
  }
  let mealsConfirmed=0, mealsPartial=0;
  for (const m of MEALS) {
    if (state.feeding[m.id]?.completed) mealsConfirmed++;
    else if (state.feeding[m.id] && Object.values(state.feeding[m.id].items||{}).some(i=>i.checked)) mealsPartial++;
  }
  chip('Feeding',{done:mealsConfirmed>=5,partial:mealsConfirmed>=2||mealsPartial>=1,txt:'已完成',txt2:'部分'});
  const aConfirmed = state.activity.confirmed === true;
  const hasAct = state.activity.outdoor_am || state.activity.outdoor_pm || state.activity.walking || Object.keys(state.activity.games||{}).length > 0;
  chip('Activity',{done:aConfirmed,partial:hasAct,txt:'已打卡',txt2:'编辑中'});
  const sConfirmed = state.sleep.confirmed === true;
  const hasSleep = (state.sleep.night + state.sleep.nap_am + state.sleep.nap_pm) > 0;
  chip('Sleep',{done:sConfirmed,partial:hasSleep,txt:'已打卡',txt2:'编辑中'});
  const wConfirmed = state.water.confirmed === true;
  const hasWater = (state.water.records||[]).length > 0;
  chip('Water',{done:wConfirmed,partial:hasWater,txt:'已打卡',txt2:'编辑中'});
  const supConfirmed = state.supplements.confirmed === true;
  const hasSupps = state.supplements.ad || state.supplements.dha;
  chip('Supps',{done:supConfirmed,partial:hasSupps,txt:'已打卡',txt2:'编辑中'});

  // Measurement chip
  const profile = getBabyProfile();
  const m = profile.measurements;
  const hasMeasure = m.height || m.weight || m.foot;
  const mEl = document.getElementById('chipMeasure');
  if (hasMeasure) {
    mEl.style.display = 'inline';
    mEl.className = 'section-chip done';
    mEl.textContent = '已记录';
  } else {
    mEl.style.display = 'inline';
    mEl.className = 'section-chip none';
    mEl.textContent = '未记录';
  }
}

// ========== COMPREHENSIVE ANALYSIS ==========
function renderAnalysis() {
  const ref = getAgeRef();
  let milk=0,grain=0,veggie=0,fruit=0,meat=0;
  for (const [mid, meal] of Object.entries(state.feeding)) {
    const items = meal.items||{};
    if (items.milk?.checked) milk+=items.milk.qty||0;
    if (items.milk2?.checked) milk+=items.milk2.qty||0;
    if (items.milk3?.checked) milk+=items.milk3.qty||0;
    if (items.yogurt?.checked) milk+=items.yogurt.qty||0;
    if (items.bread?.checked) grain+=items.bread.qty||0;
    if (items.porridge?.checked) grain+=items.porridge.qty||0;
    if (items.rice?.checked) grain+=items.rice.qty||0;
    if (items.rice2?.checked) grain+=items.rice2.qty||0;
    if (items.veggie?.checked) veggie+=items.veggie.qty||0;
    if (items.veggie2?.checked) veggie+=items.veggie2.qty||0;
    if (items.soup?.checked) veggie+=items.soup.qty||0;
    if (items.fruit?.checked) fruit+=items.fruit.qty||0;
    if (items.fruit2?.checked) fruit+=items.fruit2.qty||0;
    if (items.meat?.checked) meat+=items.meat.qty||0;
    if (items.meat2?.checked) meat+=items.meat2.qty||0;
    if (items.egg?.checked) meat+=items.egg.qty||0;
  }
  const water = (state.water.records||[]).reduce((s,r)=>s+(r.amount||0),0);
  const outdoor = (state.activity.outdoor_am?state.activity.outdoor_am_min:0)+(state.activity.outdoor_pm?state.activity.outdoor_pm_min:0);
  const totalSleep = state.sleep.night+state.sleep.nap_am+state.sleep.nap_pm;

  let html = '';

  // 0. Growth & Development (NEW)
  const profile = getBabyProfile();
  const ageM = profile.birthday ? calcAgeMonths(profile.birthday) : 12;
  const gender = profile.gender || 'boy';
  const m = profile.measurements;

  if (m.height?.value || m.weight?.value) {
    html += '<div class="analysis-dim"><div class="analysis-dim-title">生长发育 <span style="font-size:11px;font-weight:400;color:var(--text2)">WHO标准 ' + ageM + '个月' + (gender==='boy'?'男':'女') + '童</span></div>';

    if (m.height?.value) {
      const hRef = getGrowthRef(gender, 'height', ageM);
      const hEval = evaluateGrowth(m.height.value, hRef);
      const hPct = hRef ? Math.min(100, Math.round(m.height.value / hRef.p50 * 100)) : 0;
      html += '<div class="analysis-item"><div class="analysis-header"><span class="analysis-name">身高</span><span class="analysis-status '+(hEval?.level||'ok')+'">'+(hEval?.label||'--')+'</span></div>';
      html += '<div class="analysis-bar"><div class="analysis-fill '+(hEval?.level||'ok')+'" style="width:'+hPct+'%"></div></div>';
      html += '<div class="analysis-detail">实际 ' + m.height.value + ' cm / 参考 P50: ' + hRef.p50 + ' cm（P3-P97: ' + hRef.p3 + '-' + hRef.p97 + '）</div>';
      if (hEval?.desc) html += '<div class="growth-advice ' + hEval.level + '">' + hEval.desc + '</div>';
      html += '</div>';
    }

    if (m.weight?.value) {
      const wRef = getGrowthRef(gender, 'weight', ageM);
      const wEval = evaluateGrowth(m.weight.value, wRef);
      const wPct = wRef ? Math.min(100, Math.round(m.weight.value / wRef.p50 * 100)) : 0;
      html += '<div class="analysis-item"><div class="analysis-header"><span class="analysis-name">体重</span><span class="analysis-status '+(wEval?.level||'ok')+'">'+(wEval?.label||'--')+'</span></div>';
      html += '<div class="analysis-bar"><div class="analysis-fill '+(wEval?.level||'ok')+'" style="width:'+wPct+'%"></div></div>';
      html += '<div class="analysis-detail">实际 ' + m.weight.value + ' kg / 参考 P50: ' + wRef.p50 + ' kg（P3-P97: ' + wRef.p3 + '-' + wRef.p97 + '）</div>';
      if (wEval?.desc) html += '<div class="growth-advice ' + wEval.level + '">' + wEval.desc + '</div>';
      html += '</div>';
    }

    if (m.foot?.value) {
      const fRef = getFootRef(ageM);
      html += '<div class="analysis-item"><div class="analysis-header"><span class="analysis-name">脚长</span><span class="analysis-status ok">参考 ' + fRef + ' cm</span></div>';
      html += '<div class="analysis-detail">实际 ' + m.foot.value + ' cm / 同龄参考 ' + fRef + ' cm</div></div>';
    }

    if (m.height?.value && m.weight?.value && gender) {
      const bmi = Math.round(m.weight.value / ((m.height.value/100) * (m.height.value/100)) * 10) / 10;
      let bmiAdvice = '';
      if (bmi < 13) bmiAdvice = '偏瘦，注意加强蛋白质摄入';
      else if (bmi > 18) bmiAdvice = '偏重，注意控制零食和糖分摄入';
      else bmiAdvice = '体型匀称，保持均衡饮食';
      html += '<div class="analysis-item"><div class="analysis-header"><span class="analysis-name">BMI 指数</span><span class="analysis-status ok">' + bmi + '</span></div>';
      html += '<div class="analysis-detail">BMI = ' + m.weight.value + ' ÷ (' + (m.height.value/100) + ')² = ' + bmi + ' · ' + bmiAdvice + '</div></div>';
    }

    html += '</div>';
  }

  // 1. Diet
  html += '<div class="analysis-dim"><div class="analysis-dim-title">饮食摄入</div>';
  const dietCats = [
    { name:'奶类', unit:'ml', actual:milk, refMin:ref.milk.min, refMax:ref.milk.max },
    { name:'谷物', unit:'克', actual:grain, refMin:ref.grain.min, refMax:ref.grain.max },
    { name:'蔬菜', unit:'克', actual:veggie, refMin:ref.veggie.min, refMax:ref.veggie.max },
    { name:'水果', unit:'份', actual:fruit, refMin:ref.fruit.min, refMax:ref.fruit.max },
    { name:'肉禽蛋', unit:'克', actual:meat, refMin:ref.meat.min, refMax:ref.meat.max }
  ];
  for (const c of dietCats) html += renderAnalysisItem(c, 'min');
  html += '</div>';

  // 2. Sleep
  html += '<div class="analysis-dim"><div class="analysis-dim-title">睡眠</div>';
  html += renderAnalysisItem({ name:'夜间睡眠', unit:'h', actual:state.sleep.night, refMin:ref.sleep.night*-0.1+ref.sleep.night, refMax:ref.sleep.night*1.1 }, 'min');
  html += renderAnalysisItem({ name:'日间小睡', unit:'h', actual:state.sleep.nap_am+state.sleep.nap_pm, refMin:ref.sleep.naps*-0.15+ref.sleep.naps, refMax:ref.sleep.naps*1.15 }, 'min');
  html += renderAnalysisItem({ name:'总睡眠', unit:'h', actual:totalSleep, refMin:ref.sleep.total*-0.1+ref.sleep.total, refMax:ref.sleep.total*1.1 }, 'min');
  html += '</div>';

  // 3. Activity
  html += '<div class="analysis-dim"><div class="analysis-dim-title">活动</div>';
  html += renderAnalysisItem({ name:'户外活动', unit:'分钟', actual:outdoor, refMin:ref.outdoor.min, refMax:ref.outdoor.max }, 'min');
  const gameCount = Object.keys(state.activity.games||{}).length;
  const gameMin = Object.values(state.activity.games||{}).reduce((s,v)=>s+(v||0),0);
  html += renderAnalysisItem({ name:'亲子游戏', unit:'项', actual:gameCount, refMin:2, refMax:5 }, 'min');
  html += renderAnalysisItem({ name:'游戏总时长', unit:'分钟', actual:gameMin, refMin:15, refMax:60 }, 'min');
  html += '</div>';

  // 4. Water
  html += '<div class="analysis-dim"><div class="analysis-dim-title">饮水</div>';
  html += renderAnalysisItem({ name:'饮水量', unit:'ml', actual:water, refMin:ref.water.min, refMax:ref.water.max }, 'min');
  html += '</div>';

  // 5. Supplements
  html += '<div class="analysis-dim"><div class="analysis-dim-title">补充剂</div>';
  html += renderAnalysisItem({ name:'维生素AD', unit:'', actual:state.supplements.ad?1:0, refMin:1, refMax:1 }, 'count');
  html += renderAnalysisItem({ name:'DHA', unit:'', actual:state.supplements.dha?1:0, refMin:0.5, refMax:1 }, 'count');
  html += '</div>';

  // 6. Milestones
  html += '<div class="analysis-dim"><div class="analysis-dim-title">发育里程碑 <span style="font-size:11px;font-weight:400;color:var(--text2)">参考对照</span></div>';
  for (const mile of (ref.milestones||[])) {
    html += '<div style="padding:8px 12px;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:8px"><span style="color:var(--blue)">○</span> '+mile+'</div>';
  }
  html += '</div>';

  document.getElementById('analysisContent').innerHTML = html;
}

function renderAnalysisItem(c, type) {
  const refVal = type === 'min' ? c.refMin : (type === 'count' ? c.refMin : c.refMin);
  const pct = refVal > 0 ? Math.min(100, Math.round(c.actual / refVal * 100)) : 0;
  const cls = pct >= 80 ? 'ok' : pct >= 40 ? 'warn' : 'bad';
  let statusText = pct >= 80 ? '达标 ✓' : pct >= 40 ? '不足 ⚠' : '严重不足 ✗';
  if (type === 'count') statusText = c.actual >= c.refMin ? '已完成 ✓' : '未完成 ✗';
  let refText = '参考 '+c.refMin+(c.refMax!==c.refMin?'-'+c.refMax:'')+c.unit;
  if (type === 'count') refText = '建议每日补充';
  return '<div class="analysis-item"><div class="analysis-header"><span class="analysis-name">'+c.name+'</span><span class="analysis-status '+cls+'">'+statusText+'</span></div><div class="analysis-bar"><div class="analysis-fill '+cls+'" style="width:'+Math.min(pct,100)+'%"></div></div><div class="analysis-detail">实际 '+c.actual+c.unit+' / '+refText+'</div></div>';
}

// ========== ALERTS ==========
function renderAlerts() {
  const alerts = [];
  const ref = getAgeRef();
  let milk=0,fruit=0,veggie=0,grain=0,meat=0,hasDinnerMeat=false;

  for (const [mid, meal] of Object.entries(state.feeding)) {
    const items = meal.items||{};
    if (items.milk?.checked) milk+=items.milk.qty||0;
    if (items.milk2?.checked) milk+=items.milk2.qty||0;
    if (items.milk3?.checked) milk+=items.milk3.qty||0;
    if (items.yogurt?.checked) milk+=items.yogurt.qty||0;
    if (items.fruit?.checked) fruit+=items.fruit.qty||0;
    if (items.fruit2?.checked) fruit+=items.fruit2.qty||0;
    if (items.veggie?.checked) veggie+=items.veggie.qty||0;
    if (items.veggie2?.checked) veggie+=items.veggie2.qty||0;
    if (items.soup?.checked) veggie+=items.soup.qty||0;
    if (items.bread?.checked) grain+=items.bread.qty||0;
    if (items.porridge?.checked) grain+=items.porridge.qty||0;
    if (items.rice?.checked) grain+=items.rice.qty||0;
    if (items.rice2?.checked) grain+=items.rice2.qty||0;
    if (items.meat?.checked) meat+=items.meat.qty||0;
    if (items.meat2?.checked) meat+=items.meat2.qty||0;
    if (items.egg?.checked) meat+=items.egg.qty||0;
    if (mid==='dinner' && ((items.meat2?.checked&&items.meat2.qty>0)||items.meat?.checked)) hasDinnerMeat=true;
  }

  if (milk<ref.milk.min) alerts.push({level:'danger',title:'奶量不足',desc:'今日 '+milk+'ml，参考 '+ref.milk.min+'-'+ref.milk.max+'ml'});
  else if (milk<ref.milk.min*0.9) alerts.push({level:'warning',title:'奶量略低',desc:'今日 '+milk+'ml，参考 '+ref.milk.min+'-'+ref.milk.max+'ml'});
  if (fruit===0) alerts.push({level:'danger',title:'未摄入水果',desc:'上午和下午加餐各一份水果'});
  if (veggie===0) alerts.push({level:'danger',title:'未摄入蔬菜',desc:'午晚餐应至少含一份蔬菜'});
  if (meat===0) alerts.push({level:'danger',title:'未摄入肉禽蛋',desc:'蛋白质对发育至关重要'});
  if (grain>ref.grain.max*1.2) alerts.push({level:'warning',title:'谷物偏多',desc:'今日 '+grain+'克，参考 '+ref.grain.min+'-'+ref.grain.max+'克'});
  if (!hasDinnerMeat && Object.values(state.feeding.dinner?.items||{}).some(i=>i.checked)) {
    alerts.push({level:'info',title:'晚餐缺蛋白质',desc:'建议搭配肉/鱼/豆制品'});
  }

  const outdoor = (state.activity.outdoor_am?state.activity.outdoor_am_min:0)+(state.activity.outdoor_pm?state.activity.outdoor_pm_min:0);
  if (outdoor===0) alerts.push({level:'danger',title:'无户外活动',desc:'建议每天至少 '+ref.outdoor.min+' 分钟户外'});
  else if (outdoor<ref.outdoor.min) alerts.push({level:'warning',title:'户外仅 '+outdoor+' 分钟',desc:'参考 '+ref.outdoor.min+'-'+ref.outdoor.max+' 分钟'});
  const gameCount = Object.keys(state.activity.games||{}).length;
  if (gameCount<2) alerts.push({level:'info',title:'亲子互动偏少',desc:'仅 '+gameCount+' 项游戏，建议 3 项以上'});

  const totalSleep = state.sleep.night+state.sleep.nap_am+state.sleep.nap_pm;
  if (totalSleep>0 && totalSleep<ref.sleep.total*0.85) alerts.push({level:'warning',title:'睡眠仅 '+totalSleep+'h',desc:'本年龄段需要约 '+ref.sleep.total+' 小时睡眠'});

  const tw = (state.water.records||[]).reduce((s,r)=>s+(r.amount||0),0);
  if (tw<ref.water.min*0.75) alerts.push({level:'danger',title:'饮水仅 '+tw+'ml',desc:'参考每天 '+ref.water.min+'-'+ref.water.max+'ml'});

  if (!state.supplements.ad) alerts.push({level:'danger',title:'未补充维生素AD',desc:'每天必须补充 AD 滴剂'});
  if (!state.supplements.dha) alerts.push({level:'info',title:'未补充 DHA',desc:'可每周 2-3 次补充'});

  // Growth alerts (NEW)
  const profile = getBabyProfile();
  const ageM = profile.birthday ? calcAgeMonths(profile.birthday) : 12;
  const gender = profile.gender || 'boy';
  const meas = profile.measurements;

  if (meas.height?.value) {
    const hRef = getGrowthRef(gender, 'height', ageM);
    const hEval = evaluateGrowth(meas.height.value, hRef);
    if (hEval?.level === 'bad') {
      alerts.push({level:'danger',title:'身高落后于同龄标准',desc:'身高 '+meas.height.value+'cm，低于同龄P3（'+hRef.p3+'cm），建议咨询儿科医生评估生长发育'});
    } else if (hEval?.level === 'warn' && hEval.pct < 0.95) {
      alerts.push({level:'warning',title:'身高略低于同龄平均',desc:'身高 '+meas.height.value+'cm，同龄P50为 '+hRef.p50+'cm。建议保证充足睡眠、均衡营养和户外运动'});
    }
  }

  if (meas.weight?.value) {
    const wRef = getGrowthRef(gender, 'weight', ageM);
    const wEval = evaluateGrowth(meas.weight.value, wRef);
    if (wEval?.level === 'bad') {
      alerts.push({level:'danger',title:'体重落后于同龄标准',desc:'体重 '+meas.weight.value+'kg，低于同龄P3（'+wRef.p3+'kg），建议咨询儿科医生'});
    } else if (wEval?.level === 'warn' && meas.weight.value > wRef.p97) {
      alerts.push({level:'warning',title:'体重偏高',desc:'体重 '+meas.weight.value+'kg，超出同龄P97（'+wRef.p97+'kg），注意均衡饮食和多运动'});
    }
  }

  document.getElementById('alertDot').style.display = alerts.filter(a=>a.level==='danger').length>0?'block':'none';

  document.getElementById('alertsContent').innerHTML = alerts.length===0
    ? '<div class="no-alerts"><div style="font-size:40px;margin-bottom:8px">🎉</div>今日所有指标均达标！</div>'
    : alerts.map(a => '<div class="alert-item '+a.level+'"><div class="alert-title">'+(a.level==='danger'?'🔴':a.level==='warning'?'🟠':'🔵')+' '+a.title+'</div><div class="alert-desc">'+a.desc+'</div></div>').join('');
}

// ========== ROOM SYNC ==========
function renderRoomPanel() {
  const sync = getSyncConfig();
  const content = document.getElementById('roomContent');
  if (sync.mode === 'server' && sync.url) {
    const memberHtml = '<span class="member-chip me">'+(sync.role==='creator'?'👑 ':'')+(sync.nickname||'我')+'</span>' + (sync.members||[]).map(m => '<span class="member-chip">'+(m.nickname||m)+(m.role==='creator'?' 👑':'')+'</span>').join('');
    content.innerHTML = '<div class="room-code-display"><div class="room-code-label">家庭房间码</div><div class="room-code-val">'+(sync.roomCode||'---')+'</div></div><div class="room-members">'+memberHtml+'</div><div class="room-btns"><button class="room-btn-sm" onclick="switchToLocal()">切换到本机</button></div>';
  } else if (sync.mode === 'create') {
    content.innerHTML = '<div style="text-align:center;margin-bottom:12px"><div style="font-size:13px;color:var(--text2);margin-bottom:4px">创建家庭房间</div><div class="room-code-val">'+(sync.tempCode||'------')+'</div></div><div class="sync-server-input"><input class="sync-input" type="text" id="serverUrl" placeholder="服务器地址" value="'+(sync.url||'')+'"><button class="room-btn-sm primary" onclick="connectAndCreate()">创建并连接</button></div><div class="room-btns"><button class="room-btn-sm" onclick="switchToLocal()">取消</button></div>';
  } else {
    content.innerHTML = '<div class="room-hint-text" style="margin-bottom:12px">开启家庭同步，爷爷奶奶一起记录，数据统一分析。</div><div class="sync-server-input"><input class="sync-input" type="text" id="serverUrl" value="'+window.location.origin+'" placeholder="后端服务地址"><button class="room-btn-sm primary" onclick="showJoinOrCreate()">连接服务器</button></div><div class="room-hint-text" style="margin-top:6px;font-size:10px">提示：当前为<b>本机记录模式</b></div>';
  }
}

function toggleRoom() {
  document.getElementById('roomPanel').classList.toggle('show');
  renderRoomPanel();
}
function switchToLocal() {
  setSyncConfig({ mode:'local' });
  document.getElementById('syncStatus').innerHTML = '<span class="sync-dot local"></span> 本机';
  document.getElementById('roomBtn').className = 'app-badge offline';
  document.getElementById('roomBtn').textContent = '👨‍👩‍👧 同步';
  renderRoomPanel();

function showJoinOrCreate() {
  const url = document.getElementById('serverUrl')?.value?.trim();
  if (!url) { alert('请输入服务器地址'); return; }
  const content = document.getElementById('roomContent');
  content.innerHTML = '<div style="display:flex;gap:8px;margin-bottom:12px"><button class="room-btn-sm primary" onclick="goCreate(\''+url+'\')" style="flex:1">🏠 创建房间</button><button class="room-btn-sm" onclick="goJoin(\''+url+'\')" style="flex:1;background:var(--blue-l);border-color:var(--blue);color:var(--blue)">🔑 加入房间</button></div><div class="room-hint-text">创建：生成 6 位码分享给家人<br>加入：输入家人分享的房间码</div>';
}
function goCreate(url) {
  setSyncConfig({ mode:'create', url, tempCode: String(Math.floor(100000+Math.random()*900000)) });
  renderRoomPanel();
}
async function connectAndCreate() {
  const url = document.getElementById('serverUrl')?.value?.trim();
  const cfg = getSyncConfig();
  if (!url) return;
  try {
    const profile = getBabyProfile();
    const res = await fetch(url+'/api/rooms', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ name: profile.name||'安安', nickname: cfg.nickname||'爸爸' })
    });
    const data = await res.json();
    if (data.error) { alert(data.error); return; }
    if (profile.birthday) {
      fetch(url+'/api/baby-profile', {
        method:'PUT',
        headers:{'Content-Type':'application/json','x-auth-token':data.user.token,'x-user-id':data.user.id,'x-room-id':data.room.id},
        body: JSON.stringify({ name: profile.name, birthday: profile.birthday, gender: profile.gender, city: profile.city })
      }).catch(()=>{});
    }
    setSyncConfig({mode:'server',url,roomCode:data.room.code,roomId:data.room.id,nickname:data.user.nickname,userId:data.user.id,token:data.user.token,role:data.user.role,members:[]});
    document.getElementById('syncStatus').innerHTML='<span class="sync-dot online"></span> 同步';
    document.getElementById('roomBtn').className='app-badge online';
    document.getElementById('roomBtn').textContent='码: '+data.room.code;
    updateRoleUI();
    renderRoomPanel();
    syncToServer();
    alert('房间创建成功！房间码：'+data.room.code+'\n分享给家人即可加入');
  } catch(e) { alert('连接失败：'+e.message); }
}
function goJoin(url) {
  const code = prompt('请输入家庭房间码（6位数字）：');
  if (!code) return;
  (async () => {
    try {
      const nickname = prompt('你的昵称：', '奶奶')||'家人';
      const res = await fetch(url+'/api/rooms/join', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ code, nickname })
      });
      const data = await res.json();
      if (data.error) { alert(data.error); return; }
      if (data.baby?.name) {
        saveBabyProfile({ name: data.baby.name, birthday: data.baby.birthday||'', gender: data.baby.gender||'boy', city: data.baby.city||'', measurements: data.baby.measurements||{height:null,weight:null,foot:null} });
      }
      setSyncConfig({mode:'server',url,roomCode:data.room.code,roomId:data.room.id,nickname:data.user.nickname,userId:data.user.id,token:data.user.token,role:data.user.role,members:data.members||[]});
      document.getElementById('syncStatus').innerHTML='<span class="sync-dot online"></span> 同步';
      document.getElementById('roomBtn').className='app-badge online';
      document.getElementById('roomBtn').textContent='码: '+data.room.code;
      updateRoleUI();
      renderRoomPanel();
      renderAll();
      loadFromServer();
      alert('加入成功！已和 '+(data.members||[]).map(m=>m.nickname).join('、')+' 一起记录');
    } catch(e) { alert('加入失败：'+e.message); }
  })();
}

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

  if (tab==='record') { document.querySelector('.tab-btn:nth-child(1)').classList.add('active'); document.getElementById('tabRecord').classList.add('active'); }

  else { document.querySelector('.tab-btn:nth-child(3)').classList.add('active'); document.getElementById('tabAlerts').classList.add('active'); renderAlerts(); }
}

    document.getElementById('roomBtn').textContent = '码: '+(cfg.roomCode||'---');
    updateRoleUI();
    loadFromServer();
    setInterval(() => {
      fetch(cfg.url+'/api/room', {
        headers: { 'x-auth-token':cfg.token, 'x-user-id':cfg.userId, 'x-room-id':cfg.roomId }
      }).then(r=>r.json()).then(data=>{
        if (data.users && data.room) {
          setSyncConfig({ ...cfg, members: data.users });
          if (data.baby?.name) saveBabyProfile({ name: data.baby.name, birthday: data.baby.birthday||'', gender: data.baby.gender||'boy', city: data.baby.city||'', measurements: data.baby.measurements||{height:null,weight:null,foot:null} });
        }
      }).catch(()=>{});
      loadFromServer();
    }, 15000);
    fetch(cfg.url+'/api/baby-profile', {
      headers: { 'x-auth-token':cfg.token, 'x-user-id':cfg.userId, 'x-room-id':cfg.roomId }
    }).then(r=>r.json()).then(p=>{
      if (p?.name && p.name !== '安安') saveBabyProfile({ name: p.name, birthday: p.birthday||'', gender: p.gender||'boy', city: p.city||'' });
    }).catch(()=>{});
  }

  // Refresh weather every hour
  setInterval(() => refreshWeather(), 3600000);
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').then(function(reg) {
    console.log('SW registered:', reg.scope);
  }).catch(function(err) {
    console.log('SW registration failed:', err);
  });
}
</script>
</body>
</html>
